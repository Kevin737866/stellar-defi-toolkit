[package]
name = "stellar-defi-toolkit"
version = "0.1.0"
edition = "2021"
autoexamples = false
authors = ["OpenAI <support@openai.com>"]
description = "Soroban-oriented lending and borrowing protocol primitives for Stellar"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/stellar-defi-toolkit"
homepage = "https://github.com/yourusername/stellar-defi-toolkit"
keywords = ["stellar", "soroban", "defi", "lending", "borrowing"]
categories = ["cryptography::cryptocurrencies", "web-programming"]

[dependencies]
# Soroban SDK for smart contract development
soroban-sdk = { version = "21.0.0", features = [] }
soroban-token-sdk = "21.0.0"

# Stellar SDK for blockchain interactions
stellar_sdk = "0.1.4"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# GraphQL
async-graphql = { version = "7.0", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.0"
axum = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"

# Unique identifiers
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[[bin]]
name = "stellar-defi-cli"
path = "src/main.rs"

[[example]]
name = "yield_vault"
path = "examples/yield_vault.rs"

[[example]]
name = "liquidity_pool"
path = "examples/liquidity_pool.rs"

[[example]]
name = "multi_asset_price_feeds"
path = "examples/multi_asset_price_feeds.rs"

[lib]
name = "stellar_defi_toolkit"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
